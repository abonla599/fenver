plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.serialization"
}

android {
    namespace "xyz.fenever.assistant.nativeapp"
    compileSdk 34

    defaultConfig {
        // applicationId 与 WebView 壳（xyz.fenever.assistant）不同，两者可在同一台手机并存
        applicationId "xyz.fenever.assistant.native"
        minSdk 24
        targetSdk 34
        versionCode 66
        versionName "0.35.5"

        // 默认出口只钉这一个值：它与 ReleasePlan.SELF_APK_PATH 拼出来的下载地址必须同源，
        // 这条接缝由 android-native/app/src/test/.../ReleasePlanTest.java 的
        // "theConstantMatchesTheRealPinnedDownloadAddress"（本机 tools/shell_jvm_tests.py 跑）
        // 从客户端数，后端侧由 backend/tests/test_apk_release_discipline.py 数。
        // 旧 WebView 壳那份"三个值同主机名"的同族约束随壳于 2026-10-08 退役。
        buildConfigField "String", "DEFAULT_BASE_URL", "\"https://ai.fenever.xyz\""
    }

    signingConfigs {
        release {
            // 与壳同一把密钥、同一套环境变量：覆盖安装判签名不判版本号，
            // 缺 secret 时产未签名包给本地试装，CI 缺 secret 直接失败不发新钥匙包。
            def ksPath = System.getenv("APK_KEYSTORE")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("APK_KEYSTORE_PASSWORD")
                keyAlias System.getenv("APK_KEY_ALIAS")
                keyPassword System.getenv("APK_KEY_PASSWORD")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
            if (System.getenv("APK_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2024.06.00")
    implementation composeBom

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "androidx.navigation:navigation-compose:2.7.7"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    /* v0.34.0 判据 4/11：续命凭据（device_secret）单独放进 Keystore 支撑的加密偏好区。
     * 版本 1.1.0 是 Google Maven 上该构件最新的**稳定版**（非 alpha/beta），
     * 拉不到就按 PRD 第七节那条备选退回"平台 Keystore 手写加密封装"——
     * 唯一的禁止项是把 secret 塞进现有明文 Prefs。 */
    implementation "androidx.security:security-crypto:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    testImplementation "junit:junit:4.13.2"
}
