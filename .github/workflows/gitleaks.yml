name: Secret Scan Gate
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 全历史扫。浅克隆会漏掉早期提交里的形状，而"历史清不干净"正是
          # 本仓为 .env 被跟踪付过的学费（一把 API Key 公开了五个月）。
          # 本仓不是"只有一个提交"的快照仓：浅克隆切掉的是锚点之外的整段历史，
          # gitleaks 只剩最后一屏，而钉历史 SHA 的锁要靠全历史才取到锚点。
          # 口径由 backend/tests/test_ci_history_depth.py 守着（它枚举 workflow，run
          # 正文命中它那份 HISTORY_READING_MARKERS 里任一条标记的 job 才必须 fetch-depth: 0——那是
          # 有限标记清单而不是"任何 git 命令"，这一份靠的是 `gitleaks detect` 那一行；标记之外
          # 仍读历史、今天抓不住的形状列在那个文件的"仍漏清单"里）；这里不写提交数——
          # 那个数每提一笔就漂一次。
          fetch-depth: 0
      # 不用 gitleaks 官方 action（它对仓可见性有许可口径的坑），直接 CLI：
      # 判据和 tools/secret_scan.py 同构——形状命中即红，没有"回头再清"。
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo -c /repo/.gitleaks.toml --redact --exit-code 1
