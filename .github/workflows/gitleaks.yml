name: Secret Scan Gate
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 全历史扫。浅克隆会漏掉早期提交里的形状，而"历史清不干净"正是
          # 本仓为 .env 被跟踪付过的学费（一把 API Key 公开了五个月）。
          # 从前这里写过"快照仓只有一个提交，这条对它就是扫那一个"——那是从导入快照那种
          # 形状抄来的理由，对本仓不成立，已删：本仓不是"只有一个提交"的快照仓，浅克隆
          # 切掉的是锚点之外的整段历史，gitleaks 只剩最后一屏，而钉历史 SHA 的锁要靠全历史
          # 才取到锚点。口径由 backend/tests/test_ci_history_depth.py 守着（它枚举 workflow，
          # 凡 run 正文读仓库历史的 job 都必须 fetch-depth: 0）；这里刻意不写提交数——
          # 那个数每提一笔就漂一次，写进注释就是替自己造一份会腐烂的真相。
          fetch-depth: 0
      # 不用 gitleaks 官方 action（它对仓可见性有许可口径的坑），直接 CLI：
      # 判据和 tools/secret_scan.py 同构——形状命中即红，没有"回头再清"。
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo -c /repo/.gitleaks.toml --redact --exit-code 1
