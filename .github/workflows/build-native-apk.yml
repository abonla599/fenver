name: Build Native Android APK

# 原生（混合）客户端专用构建：与 build-apk.yml 同一策略——
# 本机不装 Android SDK，编译验证完全交给 GitHub runner。
on:
  workflow_dispatch:
  push:
    paths:
      - "android-native/**"
      - ".github/workflows/build-native-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Report preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        # 失败时 Gradle 的 `e:` 行原本只进作业日志，而日志要登录才能读——
        # 出包这件事卡在"看不见为什么红"上。tee 一份到工作区，下一步转成公开 annotations。
        run: |
          gradle -p android-native --no-daemon --stacktrace assembleDebug 2>&1 \
            | tee native-build.log
          exit "${PIPESTATUS[0]}"

      - name: Publish build errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|> Task .* FAILED" native-build.log | head -n 30 |
            while IFS= read -r line; do echo "::error::${line}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
