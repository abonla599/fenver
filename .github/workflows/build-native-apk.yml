name: Build Native Android APK

# 原生（混合）客户端专用构建：本机不装 Android SDK，编译验证完全交给 GitHub runner。
# 2026-10-08 起它也是唯一的安卓出包流水线——WebView 壳与它的两条流水线一起退役。
on:
  workflow_dispatch:
  push:
    paths:
      - "android-native/**"
      - ".github/workflows/build-native-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Report preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.7"

      # 先测后包：core/ 那批类不 import android.*，这一段是纯 JVM 真跑（不引 Robolectric）。
      # 顺序有意——单测挂了就没必要再花两分钟出一个不该存在的包。2026-10-08 这一段从
      # android-tests.yml 搬过来：那份流水线随 WebView 壳一起退役，判据跟着判断核走。
      - name: Unit tests (pure JVM)
        run: gradle -p android-native --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        # 失败时 Gradle 的 `e:` 行原本只进作业日志，而日志要登录才能读——
        # 出包这件事卡在"看不见为什么红"上。tee 一份到工作区，下一步转成公开 annotations。
        run: |
          gradle -p android-native --no-daemon --stacktrace assembleDebug 2>&1 \
            | tee native-build.log
          exit "${PIPESTATUS[0]}"

      - name: Publish build errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|> Task .* FAILED" native-build.log | head -n 30 |
            while IFS= read -r line; do echo "::error::${line}"; done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-assistant-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
